@if (originalImage()) {
  <div class="fixed flex flex-col items-center top-10 right-10 z-10 animate[fade-in]">
    <span>Editing</span>
    <img
      [src]="originalImage()"
      alt="Image to edit"
      class="border rounded-xl w-36 h-36 object-contain"
    />

    <button class="btn-primary mt-2" (click)="generateVariation()">Generate Variation</button>
  </div>
}

<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat Messages -->
      <app-chat-message text="What do you want to generate?"></app-chat-message>

      @for (message of messages(); track $index) {
        @if (message.isGpt) {
          <app-gpt-message-editable-image
            [text]="message.text"
            [imageUrl]="message.imageInfo"
            (onSelectedImage)="onEditImage($event, message.imageInfo!.url)"
          ></app-gpt-message-editable-image>
        } @else {
          <app-my-message [text]="message.text"></app-my-message>
        }
      }

      @if (isLoading()) {
        <app-typing-loader></app-typing-loader>
      }
    </div>
  </div>

  <!-- Message Box-->
  <app-text-message-box
    placeholder="Write a message..."
    (onMessage)="handleMessage($event)"
  ></app-text-message-box>
</div>
