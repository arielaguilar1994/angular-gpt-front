<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat Messages -->
      <app-chat-message text="How I can help you?"></app-chat-message>

      <div #scrollContainer class="overflow-y-auto p-4">
        @for (message of messages(); track message.text) { 
          @if (message.isGpt) {
            <app-chat-message [text]="message.text"></app-chat-message>
          } @else {
          <app-my-message [text]="message.text"></app-my-message>
          } 
        }

        @if (isLoading()) {
          <app-typing-loader></app-typing-loader>
        }

      </div>
    </div>
  </div>

  <!-- Message Box-->
  <app-text-message-box
    placeholder="Write a message..."
    (onMessage)="handleMessage($event)"
  ></app-text-message-box>
</div>
