<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat Messages -->
       <app-chat-message text="Please, upload the file you want me to transcribe."></app-chat-message>

      @for (message of messages(); track $index) {
        @if (message.isGpt) {
          <app-chat-message [text]="message.text"></app-chat-message>
        } @else {
          <app-my-message [text]="message.text"></app-my-message>
        }
      }

      @if (isLoading()) {
        <app-typing-loader></app-typing-loader>
      }

    </div>
  </div>

  <!-- Message Box-->
  <app-text-message-box-file
    placeholder="Write what want to do with the audio file..."
    [disableCorrections]="true"
    (onMessage)="handleMessageWithFile($event)"
  ></app-text-message-box-file>
</div>
