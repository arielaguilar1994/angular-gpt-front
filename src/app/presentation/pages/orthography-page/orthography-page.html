<div class="chat-container">
  <div class="chat-messages">
    <div class="grid gap-y-2">
      <!-- Chat Messages -->

      <app-chat-message
        text="Write the text you would like me to correct"
      ></app-chat-message>

      @for (message of messages(); track $index) {
        @if (message.isGpt) {
          <app-gpt-message-orthography
            [text]="message.text"
            [userScore]="message.info!.userScore"
            [errors]="message.info?.errors ?? []"
          ></app-gpt-message-orthography>
        } @else {
          <app-my-message [text]="message.text"></app-my-message>
        }
      }

      @if (isLoading()) {
        <app-typing-loader></app-typing-loader>
      }

    </div>
  </div>

  <!-- Message Box-->
  <app-text-message-box
    placeholder="Write a message..."
    [disableCorrections]="true"
    (onMessage)="handleMessage($event)"
  ></app-text-message-box>
</div>
